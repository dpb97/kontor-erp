de:
  - category: "Stammdaten"
    items:
      - name: "Kunden & Adressen"
        desc: "Kundenstammdaten, Adressen, Kundengruppen und Rabattstaffeln in einem zentralen CRM-Modul."
      - name: "Artikel & Lager"
        desc: "Artikelstamm, Lieferant:innen, EAN-Codes, Einheiten und Lagerbestände – die Basis der Warenwirtschaft."
      - name: "Kontakte"
        desc: "Ansprechpartner:innen je Kund:in, verknüpft mit Aktivitäten und der Mail-Archivierung."
  - category: "Verkauf"
    items:
      - name: "Bestellungen"
        desc: "Bestellungen erfassen, kalkulieren und bei Bedarf direkt in Aufträge überführen."
      - name: "Aufträge"
        desc: "Auftragsköpfe, -zeilen und Lieferscheine – vom Eingang bis zur Auslieferung lückenlos verfolgt."
      - name: "Rechnungen"
        desc: "Faktura direkt aus dem Auftragsprozess, inklusive automatischer PDF-Erzeugung."
  - category: "Vertrieb"
    items:
      - name: "Vertreter"
        desc: "Vertreterverwaltung mit Zuordnung zu Kund:innen, Gebieten und Konditionen."
  - category: "Dokumente"
    items:
      - name: "Ablage (DMS)"
        desc: "Dokumente lokal und in SharePoint – Angebote, Lieferscheine und Rechnungen an einem Ort."
      - name: "Mail-Archivierung"
        desc: "Eingehende E-Mails werden automatisch erkannt, Kund:innen zugeordnet und archiviert."

en:
  - category: "Master Data"
    items:
      - name: "Customers & Addresses"
        desc: "Customer records, addresses, customer groups and discount tiers in one central CRM module."
      - name: "Items & Inventory"
        desc: "Item master data, suppliers, EAN codes, units and stock levels – the basis of the ERP."
      - name: "Contacts"
        desc: "Contact persons per customer, linked to activities and the email archive."
  - category: "Sales"
    items:
      - name: "Orders (Purchasing)"
        desc: "Capture and calculate purchase orders, and turn them directly into sales orders when needed."
      - name: "Sales Orders"
        desc: "Order headers, lines and delivery notes, tracked seamlessly from intake to delivery."
      - name: "Invoices"
        desc: "Invoicing straight from the order process, including automatic PDF generation."
  - category: "Field Sales"
    items:
      - name: "Sales Reps"
        desc: "Sales rep management with assignment to customers, territories and terms."
  - category: "Documents"
    items:
      - name: "Filing (DMS)"
        desc: "Documents stored locally and in SharePoint – quotes, delivery notes and invoices in one place."
      - name: "Email Archiving"
        desc: "Incoming emails are recognised automatically, matched to customers and archived."
