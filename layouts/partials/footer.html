    {{ partial "logomark.html" . }}
    <div class="leading-tight">
      <p class="font-serif font-bold text-white">{{ .Site.Params.product }}</p>
      <p class="text-xs text-neutral-content/60">Warenwirtschaft für Handelsunternehmen</p>
    </div>
  </aside>
  <nav class="md:place-self-center md:justify-self-end flex flex-wrap items-center gap-x-5 gap-y-2 text-sm">
    <a href="{{ "impressum/" | relURL }}" class="text-neutral-content/70 hover:text-white transition-colors">Impressum</a>
    <a href="{{ "datenschutz/" | relURL }}" class="text-neutral-content/70 hover:text-white transition-colors">Datenschutz</a>
