baseURL = "https://dpb97.github.io/kontor-erp/"
languageCode = "de-DE"
title = "Kontor – Warenwirtschaft für Handelsunternehmen"
enableRobotsTXT = true

[params]
  product = "Kontor"
  kicker = "Warenwirtschaft für Großhandel & Import"
  tagline = "Eine Warenwirtschaft, die mit Ihrem Handel mitwächst."
  description = "Kunden, Artikel, Aufträge, Rechnungen und Dokumente – in einem System vereint. Entwickelt für Großhandel, Import und Fachvertrieb. Im produktiven Einsatz bei La Maison Eckmayer."
  audience = "Großhandel · Import · Fachvertrieb · Außendienst"
  contactEmail = "dominik.boeckle@gmail.com"

[[params.faq]]
  q = "Wie schnell ist Kontor einsatzbereit?"
  a = "Das hängt vom Umfang ab und wird gemeinsam in der Demo eingeschätzt. La Maison Eckmayer hat bereits in den ersten zwei Monaten hunderte Aufträge und Bestellungen über Kontor abgewickelt."

[[params.faq]]
  q = "Was passiert mit unseren bestehenden Daten?"
  a = "Kundenstamm, Artikeldaten und Historie aus Excel oder einem Altsystem werden übernommen. Dafür analysieren wir zuerst Ihren bestehenden Datenbestand und kalkulieren das Migrationspaket danach individuell."

[[params.faq]]
  q = "Wo liegen unsere Daten?"
  a = "Sie entscheiden: Kontor läuft containerisiert und lässt sich bei Ihnen vor Ort oder in der Cloud betreiben."

[[params.faq]]
  q = "Was kostet Kontor?"
  a = "Richtpreis ab 20 € pro Nutzer und Monat, ab drei Nutzern, vor Ort oder in der Cloud. Details dazu oben, die finalen Konditionen besprechen wir in der Demo."

[markup.goldmark.renderer]
  unsafe = true
